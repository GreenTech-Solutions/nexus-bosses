msg-fail-no-boss=Босс «__1__» не появился: Big Monsters не нашёл для него места. Нужна сгенерированная земля вокруг вашей точки появления (у генератора карты запрошено около __2__ тайлов во все стороны; поможет исследование карты или ожидание). Маяк возвращён, попробуйте снова.
msg-fail-vanished=Босс «__1__» исчез, не умерев. Испытание закончено без победы. Маяк истрачен: для новой попытки нужен новый.
