nexus-chorus=Хор
nexus-convergence=Схождение
nexus-silence=Безмолвие
nexus-signal-bearing=Пеленгация сигнала
nexus-builders-echo=Эхо строителей

[technology-description]
nexus-whisper=Открывает маяки Королевы арахнидов, Наблюдателя и Бродячего спидертрона. Изучается, когда вы строите стабилизатор щита на Нексусе.
nexus-whisper-scripted=Открывает маяки Королевы арахнидов, Наблюдателя и Бродячего спидертрона. Изучается, когда открыт Нексус.
nexus-chorus=Открывает маяки Двух пастей, Колосса и Чумного остова после победы над тремя боссами Шёпота. Урон лазером и электричеством +20 %.
nexus-convergence=После победы над тремя боссами Хора открывает маяки Стража бури, Пожирателя и Последнего командира. Если испытания закрывают варп-двигатель, также открывает рецепт варп-ключа. Урон пулями, рельсотроном, ракетами и снарядами +20 %.
nexus-silence=Открывает маршруты варп-двигателя. Изучается, если положить варп-ключ в реликварий хранилища.
nexus-signal-bearing=Открывает пеленгатор. Изучается, когда вы находите первую запись экспедиции.
nexus-builders-echo=Продуктивность исследований +10 %. Изучается, когда вы забираете реликвию из хранилища строителей.

