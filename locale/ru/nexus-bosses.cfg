[technology-description]
nexus-whisper=Нексус начинает шептать. Открывает маяки призыва Королевы арахнидов, Наблюдателя и Одичавшего спидертрона. Изучается, когда вы строите стабилизатор щита на Нексусе.
nexus-whisper-scripted=Нексус начинает шептать. Открывает маяки призыва Королевы арахнидов, Наблюдателя и Одичавшего спидертрона. Изучается, когда открыт Нексус.
nexus-chorus=Шёпот перерастает в хор. Открывает маяки Двух пастей, Колосса и Чумного остова. Изучается, когда убиты три босса Шёпота. Урон лазером и электричеством +20 %.
nexus-convergence=Остатки сигнала сходятся в одну точку. Открывает маяки Стража бури, Пожирателя и Последнего командира, а также рецепт варп-ключа. Изучается, когда убиты три босса Хора. Урон пулями, рельсотроном, ракетами и снарядами +20 %.
nexus-silence=Сигнала Нексуса больше нет. Открывает маршруты варп-двигателя. Изучается созданием варп-ключа из девяти трофеев.
nexus-signal-bearing=«Долгое эхо» пеленговало сигнал, чтобы найти, где отлёживаются боссы. Открывает пеленгатор. Изучается, когда вы находите первую запись экспедиции.
nexus-builders-echo=Реликвия из хранилища научила ваши лаборатории тому, как работали строители. Продуктивность исследований +10 %. Изучается, когда вы забираете реликвию.

