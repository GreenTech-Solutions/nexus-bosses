# Строки nexus-bosses: имена боссов, маяки, испытания и сообщения. Английский: ../en/nexus-bosses.cfg; держать обе в лад.

[mod-name]
nexus-bosses=Nexus Bosses

[mod-description]
nexus-bosses=Девять призываемых боссов в трёх кругах на Nexus. Создайте маяк призыва, зажгите его на Nexus и защищайте базу. Пройденный круг открывает следующий, а все три открывают варп-двигатель.

[mod-setting-name]
nexus-bosses-boss-health=Множитель здоровья боссов
nexus-bosses-beacon-cost=Множитель цены маяков призыва
nexus-bosses-gate-warp-drive=Испытания закрывают варп-двигатель
nexus-bosses-countdown=Отсчёт призыва (секунды)
nexus-bosses-big-monsters-elsewhere-off=Не пускать Big Monsters на другие планеты

[mod-setting-description]
nexus-bosses-boss-health=Здоровье Королевы арахнидов, Ядовитого логова, Стража бури и Червя-хозяина. Боссы Big Monsters следуют его собственным настройкам здоровья.
nexus-bosses-beacon-cost=Умножает омега-сплав и продвинутые фотонные процессоры в цене маяка призыва.
nexus-bosses-gate-warp-drive=Технологии варп-двигателя нужны «Испытания пройдены». Без razi-protocol варп-двигатель Nexus ведёт ещё к расколотой планете и прометию, так что испытания закрывают и их. Выключено: испытания — это только боссы и награды.
nexus-bosses-countdown=Время от зажжения маяка до прихода босса. Заодно генератор карты успевает подготовить землю для боссов Big Monsters.
nexus-bosses-big-monsters-elsewhere-off=Включено: Big Monsters не добавляет в свои события ни одну планету. Выключено: из них убирается только Nexus, и события могут дойти до Глебы, Фулгоры и Вулкана. С этим модом шансы его случайных событий в любом случае начинаются с 0; поднимите их в настройках карты Big Monsters.

[item-name]
nexus-summon-arachnid-queen=Маяк призыва: Королева арахнидов
nexus-summon-flying-saucer=Маяк призыва: Летающая тарелка
nexus-summon-evil-spider=Маяк призыва: Злой паук
nexus-summon-great-worms=Маяк призыва: Великие черви
nexus-summon-biterzilla=Маяк призыва: Биттерзилла
nexus-summon-toxic-lair=Маяк призыва: Ядовитое логово
nexus-summon-storm-guardian=Маяк призыва: Страж бури
nexus-summon-host-worm=Маяк призыва: Червь-хозяин
nexus-summon-final-boss=Маяк призыва: Финальный босс

[item-description]
nexus-summon-arachnid-queen=Круг I. Королева арахнидов и четыре левиафана приходят пешком с расстояния 150–250 тайлов и идут на маяк. Победа: королева убита.
nexus-summon-flying-saucer=Круг I. Летающая тарелка из Big Monsters прилетает за несколько сотен тайлов. Победа: уничтожены все новые тарелки.
nexus-summon-evil-spider=Круг I. Злой паук-спидертрон из Big Monsters приходит за несколько сотен тайлов. Победа: уничтожены все новые пауки.
nexus-summon-great-worms=Круг II. Боссы-черви из Big Monsters вылезают внутри вашей базы. Победа: убиты все новые черви-боссы.
nexus-summon-biterzilla=Круг II. Гигантский кусака или плевака, мать или босс-человек из Big Monsters приходит за несколько сотен тайлов. Победа: убиты все новые боссы.
nexus-summon-toxic-lair=Круг II. В 150–250 тайлах садится разбитый ядовитый корабль: выпускает боссов-кусак и плевак, его охраняют лазерные, пулемётные и артиллерийские турели. Победа: корабль уничтожен.
nexus-summon-storm-guardian=Круг III. Шагающий электрический гигант с 20 ходоками и 20 летунами приходит с расстояния 150–250 тайлов. Победа: страж убит, и бури Nexus навсегда слабее.
nexus-summon-host-worm=Круг III. Гигантский демолишер приползает с расстояния 150–250 тайлов и занимает землю вокруг маяка. Победа: червь убит.
nexus-summon-final-boss=Круг III. Финальный босс из Big Monsters приходит за несколько сотен тайлов. Победа: убиты все новые финальные боссы.

