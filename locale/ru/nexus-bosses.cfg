command-abort-help=Останавливает текущее испытание без победы; его боссы остаются живы. Только для администраторов.
log-arachnid-queen=«Долгое эхо», запись 3. На 66 и 33 % здоровья Королева арахнидов откладывает по два гнезда; каждое выпускает воинов раз в 20 секунд.
log-watcher=«Долгое эхо», запись 5. Живые дроны сопровождения позволяют Наблюдателю пометить цель и через четыре секунды выпустить четыре ракеты.
log-rogue-spidertron=«Долгое эхо», запись 6. После трёхсекундного предупреждения ЭМИ отключает постройки вокруг выбранного столба на 15 секунд.
log-twin-maws=«Долгое эхо», запись 9. Огненная пасть плюётся огнём, кислотная — кислотой; обе бьют дальше турелей и лечатся, пока живы обе. Убейте вторую пасть за 20 секунд, чтобы первая не ожила.
log-colossus=«Долгое эхо», запись 11. У Колосса шесть вариантов с разными атаками и сопротивлениями. Проверьте выбранный вариант в Кодексе и используйте указанные там типы урона, к которым он слаб.
log-plague-hulk=«Долгое эхо», запись 12. Чумной остов охраняют десять заражённых турелей. Раз в 120 секунд он высылает до семи бойцов; их споры отключают турели в отмеченном круге после трёхсекундного предупреждения. Используйте типы урона, к которым он слаб по Кодексу, и остановите отряд до подхода к турелям.
log-storm-guardian=«Долгое эхо», запись 14. Страж бури вызывает молнии во время бури и лечится до 0,5 % здоровья в секунду. Между бурями он не лечится. Заряженные осколки снижают его лечение, а пилон ослабляет молнии.
log-devourer=«Долгое эхо», запись 15. Пожиратель быстро восстанавливает здоровье. В обычном бою он ныряет на 50 % здоровья, в логове — на 66 и 33 %. Через восемь секунд он всплывает по другую сторону маяка.
log-last-commander=«Долгое эхо», запись 17. Последний командир высаживает шесть солдат раз в 45 секунд. Ниже 66 % здоровья он помечает постройку на четыре секунды перед залпом из четырёх ракет раз в 12 секунд. Ниже 33 % солдаты высаживаются за маяком. Если настройка мода включена, раз в 90 секунд атомная ракета бьёт по ближайшей турели в радиусе 60 клеток от Командира, а если её нет — по месту маяка. Это последняя запись.
codex-title=Кодекс сигнала
codex-no-log=Запись экспедиции о нём лежит где-то на Нексусе. Детектор сигнала указывает на ближайший ненайденный обломок, а каждая победа отмечает один на карте.
