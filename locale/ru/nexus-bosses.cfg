nexus-bosses-storm-shard=Используется для зарядки маяка Стража бури. Каждый осколок в маяке снижает лечение Стража во время бурь.
nexus-bosses-direction-finder=Радар, настроенный на сигнал. Выберите в нём босса: каждый просканированный сектор даёт пеленг на логово этого босса, всё точнее. Два точных пеленга пересекаются в логове.
nexus-bosses-commander-badge=Откройте консоль хранилища, чтобы раскрыть один глиф кода. При использовании значок тратится.
nexus-bosses-builders-relic=Осталась в хранилище строителей. Забрав её, вы получаете +10 % к продуктивности исследований.

