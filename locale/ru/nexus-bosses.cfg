finder-waiting=Ждём первого скана.
finder-scanning=Пеленг ±__1__° после __2__ сканов. С каждым сканом точнее.
finder-precise=Пеленг ±__1__°: точный. Пересеките его со вторым пеленгатором.
finder-found=Логово найдено и отмечено на карте.
finder-hint=Два пеленгатора подальше друг от друга, оба с точным пеленгом на одного босса, находят логово там, где пеленги пересекаются.
codex-lair=Логово: [gps=__1__,__2__,__3__]. Побед в нём: __4__. Следующий второй трофей: __5__.
codex-no-lair=Логово ещё не найдено. Два пеленгатора, настроенные на этого босса, найдут его там, где пересекутся пеленги.
msg-pylon-repaired=Пилон в логове «__1__» проснулся. Призванный в этом логове босс придёт с меньшим на __2__ % здоровьем.
msg-pylon-needs=Пилон мёртв. Его будит трофей босса этого логова лучше обычного качества, например __1__.
msg-pylon-weakens=Пилон логова сдерживает «__1__»: босс придёт с меньшим на __2__ % здоровьем.
msg-camp-revealed=Сигнал указывает на старый лагерь: [gps=__1__,__2__,__3__].
msg-last-stand-revealed=Сигнал стих, и издалека отвечает слабый маяк: [gps=__1__,__2__,__3__].
msg-camp-found=Найдена первая запись «Долгого эха». Она в Кодексе.
msg-last-stand-found=Найдена последняя запись начальника «Долгого эха». Она в Кодексе.
codex-expedition-title=«Долгое эхо»
codex-expedition-intro=Экспедиция, которая ответила на сигнал раньше вас.
codex-no-camp=Её лагерь где-то недалеко от места высадки: Шёпот укажет на него.
codex-no-last-stand=Начальник экспедиции не остался с остальными. Куда он ушёл, станет видно, когда сигнал стихнет.
log-camp=«Долгое эхо», запись 1. Сели на сигнал, как приказано. Лагерь стоит там, где сигнал громче всего, и он не умолкает ни на минуту. Холмы вокруг — не камни. Стены всё равно поставили. Что бы ни ответило на сигнал, мы увидим это первыми.
log-last-stand=«Долгое эхо», запись начальника. Остальных нет — или они теперь сигнал, я уже не различаю голоса. Я взял капсулу и полетел к источнику и нашёл хранилище тех, кто строил пилоны. Его обелиски говорят в порядке, на который я не сумел ответить. Если вы это читаете, сигнал умолк, и умолк из-за вас. Возьмите знак. Пусть кто-то помнит: было семнадцать записей, и некому было их прочесть.
alert-hallucination=Там что-то движется
whisper-wreck=…оно лежит там, всегда лежало там… [gps=__1__,__2__,__3__]
whisper-whisper-1=…ты тоже это слышишь…
whisper-whisper-2=…холмы дышат…
whisper-whisper-3=…здесь уже кто-то ходил до тебя…
whisper-whisper-4=…не камень, не камень, не камень…
whisper-whisper-5=…оно знает, где ты спишь…
whisper-whisper-6=…обернись…
whisper-chorus-1=…теперь нас много…
whisper-chorus-2=…стены не выдержат, они никогда не выдерживают…
whisper-chorus-3=…ответь, ответь, ответь…
whisper-chorus-4=…семнадцать записей, и некому прочесть…
whisper-chorus-5=…буря помнит твоё имя…
whisper-chorus-6=…с каждой ночью ты слышишь нас лучше…
whisper-convergence-1=…подойди ближе…
whisper-convergence-2=…земля голодна…
whisper-convergence-3=…мы были «Долгим эхом»…
whisper-convergence-4=…всё сходится на тебе…
whisper-convergence-5=…нет тишины, никогда не было тишины…
whisper-convergence-6=…мы всё ещё передаём…
finder-parallel=Пеленг ±__1__°: точный, но идёт почти вдоль других пеленгов и нигде их не пересекает. Отнесите один пеленгатор далеко в сторону.
msg-bearings-parallel=Пеленги на «__1__» идут почти рядом и не пересекаются. Поставьте пеленгатор далеко в стороне от остальных.
msg-vault-revealed=Последняя запись указывает на хранилище строителей: [gps=__1__,__2__,__3__]. Его обелиски хранят код.
msg-vault-wrong=Замок не отвечает.
msg-vault-hint=Детектор ловит эхо кода: глиф номер __1__ в порядке — __2__.
msg-vault-open=Замок хранилища открылся. Вниз ведёт люк.
msg-vault-enter=Хранилище строителей. Здесь сигнал молчит.
msg-vault-log-found=Найдена последняя запись истории. Она в Кодексе.
msg-builders-echo=Реликвия строителей: продуктивность исследований +10 %.
codex-no-vault=Начальник нашёл хранилище строителей, но открыть его не смог.
log-vault=Вырезано на реликварии глифами, которые ваш Кодекс теперь читает. Мы зажгли сигнал, чтобы другие нашли это место. Потом он начал нам отвечать, и те, кого он звал, не уходили. Мы построили пилоны, чтобы его сдержать, и хранилище, чтобы переждать. Мы ждали слишком долго. Тот, кто заставил его замолчать: всё, что мы хранили, — ваше.
