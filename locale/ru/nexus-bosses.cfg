[mod-name]
nexus-bosses=Nexus Bosses

[mod-description]
nexus-bosses=Девять боссов для Нексуса (Nexus Extended Promethium Endgame). Зажгите маяк призыва, защищайте его до конца отсчёта, победите босса и заберите трофей. Если испытания закрывают варп-двигатель, из девяти трофеев собирается варп-ключ; положите его в реликварий хранилища, чтобы изучить Безмолвие и открыть маршруты к облаку Оорта и Солу.

[mod-setting-name]
nexus-bosses-boss-health=Множитель здоровья боссов
nexus-bosses-beacon-cost=Множитель цены маяков
nexus-bosses-gate-warp-drive=Испытания закрывают варп-двигатель
nexus-bosses-countdown=Отсчёт призыва (секунды)
nexus-bosses-big-monsters-random-events=Случайные события Big Monsters
nexus-bosses-hallucinations=Галлюцинации Шёпота
nexus-bosses-skip-glyph-lock=Открывать глифовый замок без головоломки
nexus-bosses-commander-nuke=Атомная ракета Last Commander

[mod-setting-description]
nexus-bosses-boss-health=Умножает максимальное здоровье всех боссов, в том числе копий прототипов других модов.
nexus-bosses-beacon-cost=Умножает омега-сплав и продвинутые фотонные процессоры в рецептах маяков.
nexus-bosses-gate-warp-drive=Маршруты варп-двигателя к облаку Оорта и Солу открывает Безмолвие, которое изучается, если положить варп-ключ в реликварий хранилища. Край системы и расколотая планета открываются своими технологиями, как и без этого мода. Выключено: маршруты открывает варп-двигатель, как раньше, и варп-ключа нет.
nexus-bosses-countdown=Секунды от зажжения маяка до прихода босса. За это время приходят две волны предвестников. Отсчёт идёт, только пока на Нексусе есть игрок вашей команды.
nexus-bosses-big-monsters-random-events=Случайные события Big Monsters на других планетах: солдаты, черви, вулканы и другие атаки. Выключено: события отключены. Включено: Big Monsters работает по своим настройкам. Нексус исключён в обоих случаях. Атаки на ракетные шахты отключены, потому что они не учитывают список планет.
nexus-bosses-hallucinations=Ночью на Нексусе, если в радиусе 64 клеток от игрока нет построек команды, игрок может увидеть фантома, получить шёпот или ложную тревогу, либо увидеть затемнение краёв экрана. Эти эффекты видит только этот игрок; соседние игроки могут видеть фантома. Средний интервал — 10 минут в Шёпоте и 5 минут в Хоре и Схождении, с отклонением ±50 %. Режим «Редко» уменьшает частоту вдвое.
nexus-bosses-skip-glyph-lock=Хранилище строителей открывается сразу, как только его нашли, без кода обелисков.
nexus-bosses-commander-nuke=Раз в 90 секунд по ближайшей турели.

