finder-parallel=Пеленг ±__1__°: точный, но идёт почти вдоль других пеленгов и нигде их не пересекает. Отнесите один пеленгатор далеко в сторону.
msg-bearings-parallel=Пеленги на «__1__» идут почти рядом и не пересекаются. Поставьте пеленгатор далеко в стороне от остальных.
msg-vault-revealed=Хранилище находится здесь: [gps=__1__,__2__,__3__]. В его консоль вводится код из четырёх глифов.
msg-vault-wrong=Замок не отвечает.
msg-vault-hint=Глиф __2__ стоит на месте __1__ кода.
msg-vault-key-accepted=Варп-ключ потрачен. Безмолвие изучено.
msg-vault-badge=Нагрудный знак потрачен. Раскрыт один глиф кода.
msg-vault-open=Замок хранилища открылся. Вниз ведёт люк.
msg-vault-enter=Вы вошли в хранилище строителей.
msg-vault-log-found=Надпись реликвария теперь в Кодексе.
msg-builders-echo=Реликвия строителей: продуктивность исследований +10 %.
codex-no-vault=Хранилище открывается после победы над всеми девятью боссами. Код из четырёх глифов раскрывают глифы за находки и победы.
log-vault=Варп-ключ в реликварии расходуется и изучает Безмолвие.
