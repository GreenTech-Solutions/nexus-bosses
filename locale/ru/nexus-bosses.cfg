[technology-name]
nexus-trials-1=Испытания Nexus: круг I
nexus-trials-2=Испытания Nexus: круг II
nexus-trials-3=Испытания Nexus: круг III
nexus-trials-complete=Испытания пройдены

[technology-description]
nexus-trials-1=Изучается постройкой стабилизатора щита. Открывает маяки призыва круга I: Королева арахнидов, Летающая тарелка и Злой паук. Зажгите маяк на Nexus, защитите его во время отсчёта и победите пришедшего босса.
nexus-trials-1-scripted=Изучается автоматически, когда открыт Nexus (в этой игре нет стабилизатора щита, который можно построить). Открывает маяки призыва круга I: Королева арахнидов, Летающая тарелка и Злой паук. Зажгите маяк на Nexus, защитите его во время отсчёта и победите пришедшего босса.
nexus-trials-2=Изучается, когда убиты все три босса круга I. Открывает маяки призыва круга II: Великие черви, Биттерзилла и Ядовитое логово.
nexus-trials-3=Изучается, когда убиты все три босса круга II. Открывает маяки призыва круга III: Страж бури, Червь-хозяин и Финальный босс.
nexus-trials-complete=Изучается, когда убиты все три босса круга III. От неё зависит варп-двигатель, а с ним облако Оорта и Sol.
nexus-trials-complete-ungated=Изучается, когда убиты все три босса круга III.

[nexus-bosses]
beacon-rules-item=Ставится на Nexus, пока не идёт другое испытание. Босс приходит, когда кончается отсчёт; отсчёт идёт, только пока на Nexus есть игрок вашей силы. Если во время отсчёта маяк подобрать или потерять, призыв отменяется. Маяк неуязвим к молниям.
beacon-rules-entity=Если во время отсчёта маяк подобрать или потерять, призыв отменяется. Маяк неуязвим к молниям.
