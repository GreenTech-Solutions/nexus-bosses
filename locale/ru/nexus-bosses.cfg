msg-reject-force=Маяку призыва нужна сила игроков. Маяк возвращён.
msg-reject-busy=Уже идёт другое испытание («__1__»). Маяк возвращён.
msg-reject-no-bm=Big Monsters недоступен, этого босса не вызвать. Маяк возвращён.
msg-reject-bm-names=В Big Monsters нет босса такого рода (мод изменился?). Маяк возвращён.
msg-boss-appeared=Появился босс «__1__»: [gps=__2__,__3__,__4__]!
msg-spawn-closer=В 150–250 тайлах от маяка не нашлось свободной земли: босс появился в __1__ тайлах.
msg-boss-defeated=Босс «__1__» повержен!
msg-boss-defeated-again=Босс «__1__» повержен снова.
msg-circle-complete=Круг __1__ пройден: изучена технология «__2__».
msg-trials-complete=Все испытания пройдены. Путь к варп-двигателю открыт.
msg-trials-complete-ungated=Все испытания пройдены.
msg-storm-weakened=Страж бури пал: молнии бурь навсегда слабее (шанс ×__1__).
msg-storm-unavailable=Страж бури пал, но управления бурями из Nexus Threat нет. Эффект применится, как только оно появится.
msg-old-enemies-removed=Nexus Bosses: убрано врагов, которые были на Nexus: __1__. Теперь враги на Nexus приходят только с маяков призыва.
msg-fail-prototype=Босса «__1__» вызвать нельзя: нет нужных прототипов. Маяк возвращён.
