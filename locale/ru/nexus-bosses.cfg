[entity-description]
nexus-arachnid-queen=Мать арахнидских ульев Нексуса.
nexus-queen-nest=Гнездо Королевы арахнидов. Гибнет вместе с ней.
nexus-maw-fire=Одна из Двух пастей.
nexus-maw-acid=Одна из Двух пастей.
nexus-plague-hulk=Разбившийся корабль, полный ядовитых боссов-кусак.
nexus-storm-guardian=Шагающий электрический гигант.
nexus-devourer=Демолишер, выросший больше любого другого.
nexus-expedition-wreck=Обломок «Долгого эха» — экспедиции, первой услышавшей сигнал. Откройте, чтобы прочитать её запись.
nexus-bosses-direction-finder=Радар, настроенный на сигнал. Выберите в нём босса: каждый просканированный сектор даёт пеленг на логово этого босса, всё точнее. Два точных пеленга пересекаются в логове.
nexus-bosses-pylon=Кто-то строил их, чтобы глушить сигнал, задолго до «Долгого эха». Положите в него трофей босса этого логова лучше обычного качества, и он проснётся: босс, призванный здесь, придёт слабее. Трофей лучше — пилон сильнее.
nexus-expedition-camp=Корабль «Долгого эха», где экспедиция разбила лагерь. Внутри — её первая запись.
nexus-expedition-last-stand=Спасательная капсула начальника «Долгого эха», вдали от всего.
nexus-bosses-obelisk=Обелиски вокруг хранилища загораются один за другим, всегда в одном порядке.
nexus-bosses-glyph-console=Задайте здесь каждый глиф обелисков, числом — его место в их порядке (от 1 до 4), и больше ничего.
nexus-bosses-vault-hatch=Откройте, чтобы спуститься в хранилище строителей.
nexus-bosses-vault-stairs=Откройте, чтобы подняться обратно на Нексус.
nexus-bosses-reliquary=То, что хранили строители.
nexus-bosses-builders-relic=Добудьте, чтобы забрать.

