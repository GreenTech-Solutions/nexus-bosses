[mod-name]
nexus-bosses=Nexus Bosses

[mod-description]
nexus-bosses=Девять боссов для Нексуса (Nexus Extended Promethium Endgame). Зажгите маяк призыва, удержите его до конца отсчёта, убейте босса и заберите трофей. Из девяти трофеев собирается варп-ключ, который открывает маршруты варп-двигателя к облаку Оорта и Солу.

[mod-setting-name]
nexus-bosses-boss-health=Множитель здоровья боссов
nexus-bosses-beacon-cost=Множитель цены маяков
nexus-bosses-gate-warp-drive=Испытания закрывают варп-двигатель
nexus-bosses-countdown=Отсчёт призыва (секунды)
nexus-bosses-big-monsters-random-events=Случайные события Big Monsters
nexus-bosses-hallucinations=Галлюцинации Шёпота
nexus-bosses-skip-glyph-lock=Открывать глифовый замок без головоломки

[mod-setting-description]
nexus-bosses-boss-health=Умножает максимальное здоровье всех боссов, в том числе копий прототипов других модов.
nexus-bosses-beacon-cost=Умножает омега-сплав и продвинутые фотонные процессоры в рецептах маяков.
nexus-bosses-gate-warp-drive=Маршруты варп-двигателя к облаку Оорта и Солу открывает Безмолвие, а его — варп-ключ. Край системы и расколотая планета открываются своими технологиями, как и без этого мода. Выключено: маршруты открывает варп-двигатель, как раньше, и варп-ключа нет.
nexus-bosses-countdown=Секунды от зажжения маяка до прихода босса. За это время приходят две волны предвестников. Отсчёт идёт, только пока на Нексусе есть игрок вашей команды.
nexus-bosses-big-monsters-random-events=Солдаты, черви, вулканы и другие внезапные атаки Big Monsters на ваших планетах. Выключены: его боссы приходят только с маяков. Включены: Big Monsters работает по своим настройкам. Нексус исключён из его случайных событий в любом случае. Его атаки на ракетные шахты выключены: они не смотрят на список планет.
nexus-bosses-hallucinations=Ночью на Нексусе, если в 64 тайлах нет ваших построек: фантом врага на краю экрана, шёпот в чате, ложные тревоги, затемнение краёв экрана. Шёпот, тревоги и затемнение — только ваши; фантома видят и игроки рядом. Редко — вдвое реже.
nexus-bosses-skip-glyph-lock=Хранилище строителей открывается сразу, как только его нашли, без кода обелисков.

[string-mod-setting]
nexus-bosses-hallucinations-off=Выключены
