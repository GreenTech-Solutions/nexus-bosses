codex-lair=Логово: [gps=__1__,__2__,__3__]. Побед в нём: __4__. Следующий второй трофей: __5__.
codex-lair-pylon-trade=С пилоном: трофей качества пилона, половина лута.
codex-lair-hard=Модификатор сложности боя в логове: +__1__ %.
codex-no-lair=Логово ещё не найдено. Два пеленгатора, настроенные на этого босса, найдут его там, где пересекутся пеленги.
msg-pylon-repaired=Пилон в логове «__1__» починен. Главная механика босса, призванного здесь, ослаблена на __2__ %. За победу в логове дадут трофей качества пилона и половину ресурсов из рецепта маяка.
msg-pylon-needs=Пилон неактивен. Его чинит трофей босса этого логова качества «Необычное» или выше, например __1__.
msg-pylon-weakens=Пилон в этом логове ослабляет главную механику босса «__1__» на __2__ %.
msg-camp-revealed=Лагерь отмечен на Нексусе: [gps=__1__,__2__,__3__].
msg-last-stand-revealed=Последняя стоянка отмечена на Нексусе: [gps=__1__,__2__,__3__].
msg-camp-found=Первая запись «Долгого эха» теперь в Кодексе.
msg-last-stand-found=Запись начальника теперь в Кодексе; в контейнере лежит знак для консоли хранилища.
codex-expedition-title=«Долгое эхо»
codex-expedition-intro=Записи и места, связанные с экспедицией «Долгое эхо».
codex-no-camp=Лагерь отмечен на карте после изучения Шёпота. Откройте его, чтобы найти первую запись, открыть пеленгатор и получить глиф кода хранилища.
codex-no-last-stand=Последняя стоянка отмечена на карте после изучения Хора. Заберите из неё нагрудный знак, затем используйте его у консоли хранилища, чтобы раскрыть глиф кода.
log-camp=«Долгое эхо», запись 1. Открытие контейнера в лагере добавляет эту запись, открывает пеленгатор и даёт глиф кода хранилища.
log-last-stand=Запись начальника «Долгого эха». Используйте его нагрудный знак у консоли хранилища, чтобы раскрыть один глиф кода; знак тратится.
alert-hallucination=Галлюцинация
whisper-wreck=…оно лежит там, всегда лежало там… [gps=__1__,__2__,__3__]
whisper-whisper-1=…ты тоже это слышишь…
