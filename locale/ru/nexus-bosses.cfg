[item-description]
nexus-trophy-arachnid-queen=Взят с Королевы арахнидов.
nexus-trophy-watcher=Взята с Наблюдателя.
nexus-trophy-rogue-spidertron=Взято с одичавшего спидертрона.
nexus-trophy-twin-maws=Взят с Двух пастей.
nexus-trophy-colossus=Взято с Колосса.
nexus-trophy-plague-hulk=Взят из обломков Чумного остова.
nexus-trophy-storm-guardian=Взято со Стража бури. Ещё потрескивает.
nexus-trophy-devourer=Взят с Пожирателя.
nexus-trophy-last-commander=Взят с Последнего командира.
nexus-warp-key=Девять трофеев Нексуса, собранные в одно. Его создание глушит сигнал и открывает маршруты варп-двигателя.
nexus-bosses-storm-shard=Отколот от руины, которую разбудила буря Нексуса. В нём ещё держится заряд бури; его берут заряженные маяки Стража бури.
nexus-bosses-direction-finder=Радар, настроенный на сигнал. Выберите в нём босса: каждый просканированный сектор даёт пеленг на логово этого босса, всё точнее. Два точных пеленга пересекаются в логове.
nexus-bosses-commander-badge=Взят с последней стоянки начальника «Долгого эха». Ничего не делает. Это всё, что от них осталось.
nexus-bosses-builders-relic=Те, кто строил пилоны, оставили её в своём хранилище. Взяв её, ваши лаборатории чему-то научились.

