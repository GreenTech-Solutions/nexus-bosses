mechanic-arachnid-queen=На двух третях и на трети здоровья откладывает два гнезда. Каждое гнездо шлёт воинов на базу раз в 20 секунд, пока его не разрушат.
mechanic-watcher=Его сопровождают шесть электрических дронов, которые возвращаются волнами. Раз в 12 секунд, пока жив хотя бы один дрон, он помечает постройку игрока в радиусе 60 и через четыре секунды выпускает четыре ракеты. Раз в 18 секунд он приближается к цели в радиусе 600.
mechanic-rogue-spidertron=Он выбирает один из 20 ближайших электрических столбов в радиусе 200 — тот, рядом с которым в радиусе ЭМИ 12 больше всего построек игрока. Он подходит на 10 плиток; на расстоянии 25 плиток отмечает радиус 12 на три секунды, затем на 15 секунд отключает постройки в нём. Следующий удар возможен через 20 секунд.
mechanic-twin-maws=Пока живы обе пасти, каждая лечит 0,3 % максимального здоровья в секунду. Если одна погибнет, через 20 секунд она встанет с половиной здоровья, если вторая ещё жива.
mechanic-colossus=Приходит один из шести вариантов, у каждого своя атака. Бронированный вариант раз в 40 секунд на 10 секунд поглощает урон; урон его слабых типов ломает панцирь, когда он поглотил 5 % максимального здоровья.
mechanic-plague-hulk=Его охраняют десять заражённых турелей. Вылазка — до семи юнитов: спавнер выводит своих, а Остов создаёт недостающих. Споры идут с отрядом: когда он впервые подходит к турелям игрока ближе 30 плиток, на три секунды отмечается круг радиусом 15 вокруг бойца; турели в нём отключаются не более чем на 15 секунд.
mechanic-storm-guardian=Если бури Nexus-Threat нет 60 секунд, он сам вызывает её циклами: 40 секунд бури и 40 секунд затишья. Во время бури он лечит до 0,5 % здоровья в секунду и бьёт молниями вокруг себя. Каждый заряженный осколок в маяке снижает лечение на треть; пилон ослабляет молнии.
mechanic-devourer=Он ныряет на половине здоровья, а в логове — на 66 и 33 %. Через восемь секунд всплывает по другую сторону маяка.
mechanic-last-commander=Выше 66 % здоровья раз в 45 секунд в отмеченной точке в 15–25 клетках в сторону маяка высаживаются шесть солдат. Ниже 66 % он также помечает линией и кругом постройку игрока на четыре секунды, затем выпускает четыре ракеты раз в 12 секунд. Ниже 33 % солдаты высаживаются в 15–25 клетках за маяком, по другую сторону от Командира. Если включена настройка этого мода, раз в 90 секунд атомная ракета летит в ближайшую турель в радиусе 60 клеток от Командира; если такой турели нет, она бьёт по месту маяка. Любое активное ослабление пилоном отключает ракету. На порогах 66 и 33 % здоровья механики ускоряются.
codex-defeated=[img=utility/check_mark_green] Побеждён.
codex-alive=Ещё не побеждён.
answer-arachnid-queen=Гнёзда погибают вместе с Королевой, а площадной урон задевает их.
answer-watcher=Без живых дронов он не ставит метки; новые дроны приходят раз в 60 секунд.
answer-rogue-spidertron=ЭМИ отключает постройки в радиусе 12 плиток от столба с наибольшим числом построек; турели вне круга продолжают стрелять.
answer-twin-maws=Убейте обе пасти за 20 секунд: они неподвижны и бьют дальше турелей.
answer-colossus=Следующий вариант заранее виден в Кодексе, у каждого варианта своя слабость.
answer-plague-hulk=Споры идут с отрядом вылазки: убейте его до подхода к турелям.
answer-storm-guardian=Заряженные осколки в маяке снижают лечение Стража во время бури.
answer-devourer=Он выходит по другую сторону маяка, поэтому обороняйтесь со всех сторон.
answer-last-commander=Четыре ракеты следуют за четырёхсекундной меткой из линии и круга; ниже 33 % здоровья десант высаживается за маяком. Выключите настройку атомной ракеты или почините пилон в логове, чтобы отключить её 90-секундный запуск.
