mechanic-arachnid-queen=На двух третях и на трети здоровья откладывает два гнезда. Каждое гнездо шлёт воинов на базу раз в 20 секунд, пока его не разрушат.
mechanic-watcher=Его сопровождают шесть электрических дронов, которые возвращаются волнами. Раз в 12 секунд, пока жив хотя бы один дрон, он помечает здание игрока в радиусе 60 и через четыре секунды выпускает четыре ракеты. Раз в 18 секунд он приближается к зданию игрока в радиусе 1500.
mechanic-rogue-spidertron=Он идёт к столбу с наибольшим числом построек игрока в радиусе ЭМИ 12, выбирая из 20 ближайших столбов в радиусе 200. Он останавливается в 10 плитках. После предупреждения в три секунды ЭМИ отключает постройки игрока в радиусе 12 на 15 секунд; повторный удар возможен через 20 секунд.
mechanic-twin-maws=Пока живы обе пасти, каждая лечит 0,3 % максимального здоровья в секунду. Если одна погибнет, через 20 секунд она встанет с половиной здоровья, если вторая ещё жива.
mechanic-colossus=Приходит один из шести вариантов, у каждого своя атака. Бронированный вариант раз в 40 секунд на 10 секунд поглощает урон; урон слабых типов ломает панцирь раньше.
mechanic-plague-hulk=Его охраняют десять заражённых турелей. Вылазка — до семи юнитов: спавнер выводит своих, а Остов создаёт недостающих. Споры идут с отрядом: когда он впервые подходит к турелям игрока ближе 30 плиток, на три секунды отмечается круг радиусом 15 вокруг бойца; турели в нём отключаются не более чем на 15 секунд.
mechanic-storm-guardian=Во время бури Nexus-Threat он лечит 0,5 % здоровья в секунду и бьёт молниями вокруг себя. Каждый заряженный осколок в маяке снижает лечение на треть; пилон ослабляет молнии.
mechanic-devourer=При половине здоровья он ныряет и через восемь секунд вырывается на другой стороне маяка.
mechanic-last-commander=Раз в 45 секунд в отмеченной точке в 15–25 клетках в сторону маяка высаживаются шесть солдат. Если включена настройка Big Monsters «Allow nuclear soldier», раз в 90 секунд он запускает атомную ракету.
codex-defeated=[img=utility/check_mark_green] Побеждён.
codex-alive=Ещё не побеждён.
answer-arachnid-queen=Гнёзда погибают вместе с Королевой, а площадной урон задевает их.
answer-watcher=Без живых дронов он не ставит метки; новые дроны приходят раз в 60 секунд.
answer-rogue-spidertron=ЭМИ отключает постройки в радиусе 12 плиток от столба с наибольшим числом построек; турели вне круга продолжают стрелять.
answer-twin-maws=Убейте обе пасти за 20 секунд: они неподвижны и бьют дальше турелей.
answer-colossus=Следующий вариант заранее виден в Кодексе, у каждого варианта своя слабость.
answer-plague-hulk=Споры идут с отрядом вылазки: убейте его до подхода к турелям.
answer-storm-guardian=Заряженные осколки в маяке снижают лечение Стража во время бури.
answer-devourer=Он выходит по другую сторону маяка, поэтому обороняйтесь со всех сторон.
answer-last-commander=Десант высаживается в отмеченном круге; ракета нацелена на ближайшую турель.
