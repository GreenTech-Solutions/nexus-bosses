lore-arachnid-queen=Мать арахнидских ульев Нексуса, с ней два левиафана. Раните её — она отложит гнёзда.
lore-watcher=Летающая тарелка из Big Monsters. Следит за Нексусом дольше, чем на нём кто-либо жил.
lore-rogue-spidertron=Спидертрон из Big Monsters, давно потерявший хозяина, но не ракетницы.
lore-twin-maws=Два червя-босса из Big Monsters: один плюётся огнём, другой кислотой. Вылезают из земли рядом с маяком и остаются там.
lore-colossus=Гигант из Big Monsters: биттерзилла, гигантский плевака, мать выводка или человек-чемпион. Кто именно — узнаете, когда он появится.
lore-plague-hulk=Разбившийся корабль, полный ядовитых боссов-кусак. Двигаться он не может, поэтому за него работают десять заражённых турелей и споры.
lore-storm-guardian=Шагающий электрический гигант, с ним двадцать шагающих и двадцать летающих. Питается бурями Нексуса; когда он умрёт, бури навсегда потеряют половину молний.
lore-devourer=Демолишер, выросший до пяти миллионов здоровья. Объявляет своей землю вокруг маяка и уходит под землю, когда его ранят.
lore-last-commander=Финальный босс из Big Monsters: командир с пушкой и нескончаемыми солдатами.

tactic-arachnid-queen=[font=default-semibold]Как бить:[/font] лазер и огонь ранят её сильнее обычного, кислота и яд — никак. Разбейте гнёзда, пока выводок не дошёл до базы.
tactic-watcher=[font=default-semibold]Как бить:[/font] почти весь урон он пропускает мимо, лучше всего проходят лазер и электричество. Бьёт издалека, нужна дальнобойность.
tactic-rogue-spidertron=[font=default-semibold]Как бить:[/font] тяжёлая броня против всего. Давите уроном и держите ремкомплекты у турелей.
tactic-twin-maws=[font=default-semibold]Как бить:[/font] бьют дальше турелей (огонь на 80 тайлов, кислота на 60), так что идите к ним сами. Огненная пасть уязвима к лазеру и электричеству, кислотная — к огню.
tactic-colossus=[font=default-semibold]Как бить:[/font] слабость зависит от того, кто придёт. Одних гигантов валит физический урон, других — лазер: берите и то и другое.
tactic-plague-hulk=[font=default-semibold]Как бить:[/font] броня слабая, но его артиллерия бьёт по базе, пока он цел. Выходите и добивайте. Каждая вылазка глушит три ваши турели на 15 секунд.
tactic-storm-guardian=[font=default-semibold]Как бить:[/font] лазер и огонь его почти не берут, молнии лечат. Пули, рельсотрон и ракеты, и бейте между бурями.
tactic-devourer=[font=default-semibold]Как бить:[/font] лазер, огонь и удар бесполезны, а лечится он примерно на 3 000 в секунду. Взрывы и физический урон. Нырнув, он всплывает по другую сторону маяка.
tactic-last-commander=[font=default-semibold]Как бить:[/font] треть любого урона уходит в броню. Быстрый, пушка бьёт далеко. Выбивайте солдат сразу: они всё прибывают.

call-arachnid-queen=Под арахнидскими курганами шевелится что-то большое.
call-watcher=По небу проходит огонёк и замирает.
call-rogue-spidertron=Где-то вдалеке зашагали тяжёлые ноги.
call-twin-maws=Земля у маяка теплеет.
call-colossus=Все кусаки Нексуса притихли.
call-plague-hulk=С орбиты падает что-то горящее.
call-storm-guardian=Над маяком собираются тучи.
call-devourer=Земля под базой дрожит.
call-last-commander=Переговоры на старой военной частоте.

arrive-arachnid-queen=Королева арахнидов здесь, и её левиафаны с ней.
arrive-watcher=Наблюдатель спустился посмотреть поближе.
arrive-rogue-spidertron=Одичавший спидертрон идёт, ракетницы заряжены.
arrive-twin-maws=Две пасти прорвались из-под земли.
arrive-colossus=Колосс идёт.
arrive-plague-hulk=Чумной остов рухнул, его турели уже разворачиваются.
arrive-storm-guardian=Страж бури выходит из грозы.
arrive-devourer=Пожиратель проснулся, и теперь это его земля.
arrive-last-commander=Последний командир высадился со своими солдатами.

