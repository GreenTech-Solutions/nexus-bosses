arrive-arachnid-queen=Королева арахнидов прибыла; на 66 и 33 % здоровья она откладывает по два гнезда, выпускающих воинов.
arrive-watcher=Наблюдатель прибыл; живые дроны сопровождения позволяют ему пометить цель и через четыре секунды выпустить четыре ракеты.
arrive-rogue-spidertron=Бродячий спидертрон прибыл; он выбирает электрический столб, рядом с которым больше всего построек, и после трёхсекундного предупреждения отключает их ЭМИ.
arrive-twin-maws=Две пасти прибыли; пока обе живы, каждая лечит другую, а первая оживёт, если вторую не убить за 20 секунд.
arrive-colossus=Колосс прибыл; выбранный вариант определяет его атаку.
arrive-plague-hulk=Чумной остов прибыл; его отряды выпускают споры, отключающие ближайшие турели после предупреждения.
arrive-storm-guardian=Страж бури прибыл; он вызывает молнии во время бурь и может лечиться, пока идёт буря.
arrive-devourer=Пожиратель прибыл; он ныряет при порогах здоровья и всплывает по другую сторону маяка.
arrive-last-commander=Последний командир прибыл; он высаживает шесть солдат раз в 45 секунд и ниже 66 % здоровья помечает постройки для ракетных ударов.

