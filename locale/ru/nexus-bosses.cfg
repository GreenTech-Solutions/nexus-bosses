[entity-description]
nexus-arachnid-queen=Огромный арахнид, откладывает гнёзда.
nexus-queen-nest=Гнездо Королевы арахнидов. Гибнет вместе с ней.
nexus-maw-fire=Одна из Двух пастей.
nexus-maw-acid=Одна из Двух пастей.
nexus-plague-hulk=Спавнер под охраной заражённых турелей. Высылает отряды, чьи споры отключают ближайшие турели.
nexus-storm-guardian=Противник, который вызывает молнии во время бурь и лечится, пока идёт буря.
nexus-devourer=Сегментированный демолишер, который ныряет при порогах здоровья и всплывает по другую сторону маяка.
nexus-watcher=Электрическая летающая тарелка: живые дроны сопровождения позволяют ей помечать постройки для залпа из четырёх ракет.
nexus-colossus-fire=Раз в 4 секунды выпускает огненный кластер в отмеченную точку.
nexus-colossus-storm=Раз в 3 секунды создаёт электрический разряд вокруг себя.
nexus-colossus-armored=Раз в 40 секунд на 10 секунд поглощает урон; урон слабых типов ломает панцирь раньше.
nexus-colossus-mother=Раз в 20 секунд призывает до шести чудовищных кусак.
nexus-colossus-fire-spitter=Раз в 15 секунд выпускает пять огненных снарядов по ближайшей турели.
nexus-colossus-acid-spitter=Раз в 15 секунд выпускает пять кислотных струй по ближайшей турели.
nexus-rogue-spidertron=Спидертрон охотится за электрическими столбами и отключает соседние здания ЭМИ.
nexus-expedition-wreck=Откройте обломок, чтобы добавить запись «Долгого эха» в Кодекс.
nexus-bosses-direction-finder=Радар, настроенный на сигнал. Выберите в нём босса: каждый просканированный сектор даёт пеленг на логово этого босса, всё точнее. Два точных пеленга пересекаются в логове.
nexus-bosses-pylon=Трофей босса этого логова качества выше обычного чинит пилон и ослабляет главную механику босса на 25–100 % в зависимости от качества трофея. В бою с пилоном второй трофей будет его качества, а лута будет половина рецепта маяка.
nexus-expedition-camp=Корабль «Долгого эха», где экспедиция разбила лагерь. Внутри — её первая запись.
nexus-expedition-last-stand=Спасательная капсула начальника «Долгого эха».
nexus-bosses-obelisk=Обелиски вокруг хранилища загораются один за другим, всегда в одном порядке.
nexus-bosses-glyph-console=Задайте сигналами четыре глифа с обелисков. Значение каждого — его номер в порядке, в котором загораются обелиски (1–4). Других сигналов быть не должно.
nexus-bosses-vault-hatch=Откройте, чтобы спуститься в хранилище строителей.
nexus-bosses-vault-stairs=Откройте, чтобы подняться обратно на Нексус.
nexus-bosses-reliquary=Положите сюда варп-ключ, чтобы изучить Безмолвие. Если испытания закрывают варп-двигатель, первый ключ также поднимает реликвию строителей.
nexus-bosses-builders-relic=Добудьте, чтобы забрать.

