[entity-description]
nexus-arachnid-queen=Мать арахнидских ульев Нексуса. Раненая, откладывает гнёзда.
nexus-queen-nest=Выводит воинов и плевак для Королевы арахнидов и посылает их на вашу базу. Гибнет вместе с ней.
nexus-maw-fire=Одна из Двух пастей. Плюётся огнём на 80 тайлов.
nexus-maw-acid=Одна из Двух пастей. Плюётся кислотой на 60 тайлов.
nexus-plague-hulk=Разбившийся корабль, полный ядовитых боссов-кусак. Его споры на время глушат ваши турели.
nexus-storm-guardian=Шагающий электрический гигант. Бури его лечат, молнии ему не вредят.
nexus-devourer=Демолишер с пятью миллионами здоровья. На половине уходит под землю и всплывает в другом месте.

[technology-name]
nexus-whisper=Шёпот
nexus-chorus=Хор
nexus-convergence=Схождение
nexus-silence=Безмолвие

[technology-description]
nexus-whisper=Нексус начинает шептать. Открывает маяки призыва Королевы арахнидов, Наблюдателя и Одичавшего спидертрона. Изучается, когда вы строите стабилизатор щита на Нексусе.
nexus-whisper-scripted=Нексус начинает шептать. Открывает маяки призыва Королевы арахнидов, Наблюдателя и Одичавшего спидертрона. Изучается, когда открыт Нексус.
nexus-chorus=Шёпот перерастает в хор. Открывает маяки Двух пастей, Колосса и Чумного остова. Изучается, когда убиты три босса Шёпота. Урон лазером и электричеством +20 %: Хор к ним уязвим.
nexus-convergence=Остатки сигнала сходятся в одну точку. Открывает маяки Стража бури, Пожирателя и Последнего командира, а также рецепт варп-ключа. Изучается, когда убиты три босса Хора. Урон пулями, рельсотроном, ракетами и снарядами +20 %: Схождение почти не замечает энергетическое оружие.
nexus-silence=Сигнала Нексуса больше нет. Открывает маршруты варп-двигателя. Изучается созданием варп-ключа из девяти трофеев.

