command-abort-help=Останавливает текущее испытание без победы; его боссы остаются живы. Только для администраторов.
log-arachnid-queen=«Долгое эхо», запись 3. Курганы — это ульи, а у ульев есть мать. Она пришла к нашему передатчику с двумя левиафанами. Лазеры и огнемёты резали её лучше пуль, кислота и газ не брали вовсе. Каждый раз, когда мы её ранили, она останавливалась отложить гнёзда, и гнёзда слали на нас воинов, пока мы их не сожгли.
log-watcher=«Долгое эхо», запись 5. Что-то на орбите следит за лагерем. Спустившись, оно держалось на расстоянии и выжигало турели одну за другой. Почти всё, чем мы стреляли, соскальзывало с корпуса; проходили лазеры и электрические дуги. Стреляйте с самой дальней дистанции.
log-rogue-spidertron=«Долгое эхо», запись 6. Спидертрон без хозяина с полными ракетными блоками. Броня держала всё примерно одинаково, так что мы просто вливали в него урон и держали ремкомплекты у турелей. Северную стену всё равно потеряли.
log-twin-maws=«Долгое эхо», запись 9. У передатчика вылезли два червя: один плюётся огнём, другой кислотой. Они не двигались, и им не нужно: бьют дальше любой нашей турели, так что мы пошли к ним сами. Огненный не выносил лазеры и дуги, кислотный горел.
log-colossus=«Долгое эхо», запись 11. Каждый, кто видел гиганта, описывал другого: кусаку размером с холм, плеваку, мать с выводком, однажды человека в броне. Слабость менялась вместе с ним: одних валили пули, других только лазеры. Берите и то и другое.
log-plague-hulk=«Долгое эхо», запись 12. Из бури упал корабль, полный ядовитых кусак, и его турели ожили сразу после удара о землю. Корпус тонкий, но артиллерия доставала до лагеря, а каждая вылазка шла с облаком спор, от которого наши турели на время замолкали. Переждать его нельзя. Идите и убейте.
log-storm-guardian=«Долгое эхо», запись 14. Шагающий вышел из бури с армией шагающих и летающих. Лазеры и огонь его почти не брали, молнии лечили. Между бурями это просто очень большая мишень для пуль, рельсотрона и ракет: бейте тогда. Когда он пал, бури потеряли половину молний.
log-devourer=«Долгое эхо», запись 15. Земля под лагерем двинулась. Червь размером с гряду лечится быстрее, чем его можно ранить чем-то кроме взрывов и рельсотрона; лазеры, огонь и удар не брали ничего. Полумёртвым он нырнул и вылез по другую сторону передатчика.
log-last-commander=«Долгое эхо», запись 17. Военные переговоры на частоте, которой век никто не пользуется. Командир пришёл с солдатами, и солдаты всё прибывали. Треть любого удара уходит в его броню, а пушка бьёт дальше наших. Выбивайте солдат сразу. Это последняя запись.
codex-title=Кодекс сигнала
codex-no-log=Запись экспедиции о нём лежит где-то на Нексусе. Детектор сигнала указывает на ближайший ненайденный обломок, а каждая победа отмечает один на карте.
codex-defeated=[img=utility/check_mark_green] Победа одержана.
codex-alive=Победы пока нет.
msg-log-found=Найдена запись «Долгого эха»: __1__. Она в Кодексе.
msg-stage-logs=Все записи этапа «__1__» найдены.
msg-all-logs=Все записи «Долгого эха» найдены. Дальше экспедиция не прошла.
msg-wreck-revealed=Сигнал указывает на обломок экспедиции: [gps=__1__,__2__,__3__]
msg-detector-on=Детектор сигнала включён: он указывает на ближайший ненайденный обломок экспедиции.
msg-detector-off=Детектор сигнала выключен.
trigger-bearing=Найдите запись экспедиции
beacon-name-charged=Маяк призыва: __1__, заряд __2__
beacon-charged=[font=default-semibold]Заряжен:[/font] __1__ из __2__ осколков. Каждый сдерживает часть бури, которой питается Страж бури.
msg-lair-found=Пеленги пересеклись: логово «__1__» здесь: [gps=__2__,__3__,__4__]. Маяк, подожжённый там, даёт больше.
msg-lair-fight=Маяк зовёт «__1__» в логово. Победа принесёт второй трофей: __2__.
msg-lair-loot=Логово «__1__» отдаёт накопленное.
msg-bearing-learned=В записи сказано, как «Долгое эхо» пеленговало сигнал. Пеленгаторы открыты.
msg-beacon-charged=В маяке __1__ из __2__ заряженных осколков.
msg-ruin-wakes=Буря будит руину: [gps=__1__,__2__,__3__]. Она уронила заряженный осколок, вокруг бьют молнии.
status-guardian-charged=Осколки сдерживают бурю
finder-title=Пеленг
