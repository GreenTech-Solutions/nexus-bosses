[mod-name]
nexus-bosses=Nexus Bosses

[mod-description]
nexus-bosses=Нексус всё ещё передаёт сигнал. Девять тварей на нём откликаются: зажгите маяк призыва, продержитесь до конца отсчёта, убейте того, кто придёт, и заберите трофей. Сигнал нарастает от Шёпота к Хору и Схождению; из девяти трофеев собирается варп-ключ, а с ним приходят Безмолвие и маршруты варп-двигателя.

[mod-setting-name]
nexus-bosses-boss-health=Множитель здоровья боссов
nexus-bosses-beacon-cost=Множитель цены маяков
nexus-bosses-gate-warp-drive=Испытания закрывают варп-двигатель
nexus-bosses-countdown=Отсчёт призыва (секунды)
nexus-bosses-big-monsters-beacons-only=Big Monsters только через маяки

[mod-setting-description]
nexus-bosses-boss-health=Здоровье всех боссов. Боссы Big Monsters появляются не с полным здоровьем, его можно поднять только до максимума.
nexus-bosses-beacon-cost=Умножает омега-сплав и продвинутые фотонные процессоры в рецептах маяков.
nexus-bosses-gate-warp-drive=Маршруты варп-двигателя (облако Оорта и Сол; без razi-protocol ещё и расколотая планета) открывает Безмолвие, а его — варп-ключ. Выключено: маршруты открывает варп-двигатель, как раньше, и варп-ключа нет.
nexus-bosses-countdown=Секунды от зажжения маяка до прихода босса. За это время приходят две волны предвестников. Отсчёт идёт, только пока на Нексусе есть игрок вашей силы.
nexus-bosses-big-monsters-beacons-only=Включено: Big Monsters нигде не запускает случайные события, его боссы приходят только с маяков. Выключено: Big Monsters работает по своим настройкам. Нексус в любом случае исключён из его случайных событий.

