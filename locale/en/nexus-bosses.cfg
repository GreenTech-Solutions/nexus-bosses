[technology-description]
nexus-whisper=Nexus starts to whisper. Opens the summon beacons of the Arachnid Queen, the Watcher and the Rogue Spidertron. Researched when you build a shield stabilizer on Nexus.
nexus-whisper-scripted=Nexus starts to whisper. Opens the summon beacons of the Arachnid Queen, the Watcher and the Rogue Spidertron. Researched when Nexus is discovered.
nexus-chorus=The whisper turns into a chorus. Opens the beacons of the Twin Maws, the Colossus and the Plague Hulk. Researched when the three bosses of the Whisper are dead. Laser and electric damage +20 %.
nexus-convergence=What is left of the signal converges. Opens the beacons of the Storm Guardian, the Devourer and the Last Commander, and the recipe of the warp key. Researched when the three bosses of the Chorus are dead. Bullet, railgun, rocket and cannon damage +20 %.
nexus-silence=The signal of Nexus is gone. Opens the routes of the warp drive. Researched by crafting the warp key from the nine trophies.
nexus-signal-bearing=The Long Echo took bearings on the signal to find where the bosses rest. Opens the direction finder. Researched when you find the first log of the expedition.

