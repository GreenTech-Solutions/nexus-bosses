[mod-name]
nexus-bosses=Nexus Bosses

[mod-description]
nexus-bosses=Nine summonable bosses for Nexus (Nexus Extended Promethium Endgame). Light a summon beacon, defend it through the countdown, defeat the boss and take its trophy. When the trials gate the warp drive, the nine trophies craft the warp key; place it in the vault reliquary to research Silence and open routes to the Oort cloud and Sol.

[mod-setting-name]
nexus-bosses-boss-health=Boss health multiplier
nexus-bosses-beacon-cost=Beacon cost multiplier
nexus-bosses-gate-warp-drive=The trials gate the warp drive
nexus-bosses-countdown=Summon countdown (seconds)
nexus-bosses-big-monsters-random-events=Random events of Big Monsters
nexus-bosses-hallucinations=Hallucinations of the Whisper
nexus-bosses-skip-glyph-lock=Open the glyph lock without the puzzle
nexus-bosses-commander-nuke=Last Commander atomic rocket

[mod-setting-description]
nexus-bosses-boss-health=Multiplies every boss's maximum health, including copies of other mods' prototypes.
nexus-bosses-beacon-cost=Multiplies the omega alloy and the advanced photon processors in the recipes of the beacons.
nexus-bosses-gate-warp-drive=The routes of the warp drive to the Oort cloud and Sol open with Silence, researched by placing the warp key in the vault reliquary. The edge of the system and the shattered planet open by their own technologies, as without this mod. Off: the warp drive opens the routes as before, and there is no warp key.
nexus-bosses-countdown=Seconds from lighting a beacon to the arrival of the boss. Two precursor waves come in this time. The countdown runs only while a player of your force is on Nexus.
nexus-bosses-big-monsters-random-events=Big Monsters' random events on other planets: soldiers, worms, volcanoes and other attacks. Off: disabled. On: Big Monsters uses its own settings. Nexus is excluded in both cases. Attacks on rocket silos are disabled because they ignore its planet list.
nexus-bosses-hallucinations=On Nexus at night, when no force building is within 64 tiles of a player, that player may see a phantom, receive a whisper or false alert, or see darkened screen edges. These effects are player-only; nearby players can see the phantom. The average interval is 10 minutes in Whisper and 5 minutes in Chorus and Convergence, with ±50 % variation. Rare mode halves the frequency.
nexus-bosses-skip-glyph-lock=The builders' vault opens as soon as it is found, without the obelisk code.
nexus-bosses-commander-nuke=Every 90 seconds at the nearest turret.

