mechanic-arachnid-queen=At two thirds and at one third of her health she lays two nests. Each nest sends warriors at the base every 20 seconds until it is destroyed.
mechanic-watcher=Six electric drones escort it and return in waves. Every 12 seconds, if any drone lives, it marks a player building within 60 tiles and fires four rockets after four seconds. It approaches a target within 600 tiles every 18 seconds.
mechanic-rogue-spidertron=It chooses among the 20 nearest power poles within 200 tiles, targeting the one with the most player buildings in its 12-tile EMP radius. It approaches to 10 tiles; at 25 tiles it marks a 12-tile radius for three seconds, then disables buildings there for 15 seconds. It can use another EMP after 20 seconds.
mechanic-twin-maws=While both maws live, each heals 0.3 % of its maximum health per second. If one dies, it rises with half health after 20 seconds while the other lives.
mechanic-colossus=One of six variants arrives, each with a different attack. The armoured variant absorbs damage for 10 seconds every 40 seconds; damage of its weak types breaks the shell after it absorbs 5 % of its maximum health.
mechanic-plague-hulk=Ten infected turrets guard it. Each sortie has up to seven units, combining the spawner's units with any the Hulk creates. Spores follow the squad: when it first comes within 30 tiles of player turrets, a three-second warning marks a 15-tile circle around a unit; turrets in the circle stop for up to 15 seconds.
mechanic-storm-guardian=After 60 seconds without a Nexus-Threat storm, it calls its own storm in a 40-second storm / 40-second calm cycle. During a storm it heals up to 0.5 % of its health per second and calls lightning around itself. Each charged shard in the beacon reduces its healing by a third; a pylon weakens its lightning attacks.
mechanic-devourer=It dives at half health, or at 66 % and 33 % in a lair, and resurfaces eight seconds later beyond the beacon.
mechanic-last-commander=Above 66 % health, it drops six soldiers every 45 seconds at a marked spot 15–25 tiles toward the beacon. Below 66 %, it also marks a nearby player building with a line and circle for four seconds, then fires four rockets every 12 seconds. Below 33 %, soldiers drop 15–25 tiles beyond the beacon, away from the Commander. When this mod's setting is on, an atomic rocket targets the nearest turret within 60 tiles every 90 seconds, or the beacon if no turret is in range; any active pylon weakening prevents it. Its mechanics speed up at the 66 % and 33 % health thresholds.
