[technology-name]
nexus-trials-1=Nexus Trials: Circle I
nexus-trials-2=Nexus Trials: Circle II
nexus-trials-3=Nexus Trials: Circle III
nexus-trials-complete=Trials Complete

[technology-description]
nexus-trials-1=Researched by building a shield stabilizer. Unlocks the summon beacons of circle I: Arachnid Queen, Flying Saucer and Evil Spider. Light a beacon on Nexus, defend it during the countdown and defeat the boss that comes.
nexus-trials-1-scripted=Researched automatically once Nexus is discovered (this game has no shield stabilizer to build). Unlocks the summon beacons of circle I: Arachnid Queen, Flying Saucer and Evil Spider. Light a beacon on Nexus, defend it during the countdown and defeat the boss that comes.
nexus-trials-2=Researched when all three bosses of circle I are defeated. Unlocks the summon beacons of circle II: Great Worms, Biterzilla and Toxic Lair.
nexus-trials-3=Researched when all three bosses of circle II are defeated. Unlocks the summon beacons of circle III: Storm Guardian, Host Worm and Final Boss.
nexus-trials-complete=Researched when all three bosses of circle III are defeated. The warp drive, and with it the Oort cloud and Sol, waits for it.
nexus-trials-complete-ungated=Researched when all three bosses of circle III are defeated.

