[mod-name]
nexus-bosses=Nexus Bosses

[mod-description]
nexus-bosses=Nexus is still transmitting. Nine things on it answer the signal: light a summon beacon, hold it through the countdown, kill what comes and take its trophy. The signal grows from a Whisper to a Chorus to a Convergence; the nine trophies make the warp key, and with it comes Silence and the routes of the warp drive.

[mod-setting-name]
nexus-bosses-boss-health=Boss health multiplier
nexus-bosses-beacon-cost=Beacon cost multiplier
nexus-bosses-gate-warp-drive=The trials gate the warp drive
nexus-bosses-countdown=Summon countdown (seconds)
nexus-bosses-big-monsters-beacons-only=Big Monsters only through the beacons

[mod-setting-description]
nexus-bosses-boss-health=Health of every boss. The bosses of Big Monsters appear below their maximum health and can be raised up to it, not beyond.
nexus-bosses-beacon-cost=Multiplies the omega alloy and the advanced photon processors in the recipes of the beacons.
nexus-bosses-gate-warp-drive=The routes of the warp drive (the Oort cloud and Sol; without razi-protocol also the shattered planet) open with Silence, which the warp key researches. Off: the warp drive opens them as before, and there is no warp key.
nexus-bosses-countdown=Seconds from lighting a beacon to the arrival of the boss. Two precursor waves come in this time. The countdown runs only while a player of your force is on Nexus.
nexus-bosses-big-monsters-beacons-only=On: Big Monsters starts no random events anywhere, its bosses come only from the beacons. Off: Big Monsters works as its own settings say. Nexus is kept out of its random events either way.

