# Strings of nexus-bosses: boss names, beacons, trials and messages. Russian: ../ru/nexus-bosses.cfg; keep both in step.

[mod-name]
nexus-bosses=Nexus Bosses

[mod-description]
nexus-bosses=Nine summonable bosses in three circles on Nexus. Craft a summon beacon, light it on Nexus and defend your base. Beating a whole circle opens the next one; beating all three opens the warp drive.

[mod-setting-name]
nexus-bosses-boss-health=Boss health multiplier
nexus-bosses-beacon-cost=Summon beacon cost multiplier
nexus-bosses-gate-warp-drive=The trials gate the warp drive
nexus-bosses-countdown=Summon countdown (seconds)
nexus-bosses-big-monsters-elsewhere-off=Keep Big Monsters off the other planets

[mod-setting-description]
nexus-bosses-boss-health=Health of the Arachnid Queen, the Toxic Lair, the Storm Guardian and the Host Worm. The bosses of Big Monsters follow its own health settings.
nexus-bosses-beacon-cost=Multiplies the omega alloy and advanced photon processors a summon beacon costs.
nexus-bosses-gate-warp-drive=The warp drive technology needs Trials Complete. Without razi-protocol the warp drive of Nexus also leads to the shattered planet and promethium, so the trials gate those too. Off: the trials are only the bosses and their rewards.
nexus-bosses-countdown=Time from lighting a beacon to the arrival of the boss. It also gives the map generator time to prepare the land for the bosses of Big Monsters.
nexus-bosses-big-monsters-elsewhere-off=On: Big Monsters adds none of the planets to its events. Off: only Nexus is kept out of them, so its events can also reach Gleba, Fulgora and Vulcanus. With this mod the chances of its random events start at 0 either way; raise them in the map settings of Big Monsters.

