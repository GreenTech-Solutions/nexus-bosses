command-abort-help=Stops the trial under way without a victory; its bosses stay alive. Administrators only.
log-arachnid-queen=Long Echo, log 3. At 66 % and 33 % health, the Arachnid Queen lays two nests; each sends warriors every 20 seconds.
log-watcher=Long Echo, log 5. Living escort drones enable the Watcher's four-rocket strike after a four-second mark.
log-rogue-spidertron=Long Echo, log 6. The Rogue Spidertron's EMP disables buildings around the selected power pole for 15 seconds after a three-second warning.
log-twin-maws=Long Echo, log 9. The fire maw spits fire and the acid maw spits acid; both outrange turrets and heal while both live. Kill the second maw within 20 seconds to prevent the first from reviving.
log-colossus=Long Echo, log 11. The Colossus has six variants with different attacks and resistances. Check the selected variant in the Codex and use its listed weak damage types.
log-plague-hulk=Long Echo, log 12. Ten infected turrets guard the Plague Hulk. Every 120 seconds it sends up to seven sortie units; their spores disable turrets in a marked circle after a three-second warning. Use the weak damage types listed in the Codex and stop the squad before it reaches turrets.
log-storm-guardian=Long Echo, log 14. The Storm Guardian calls lightning during storms and heals up to 0.5 % of its health per second while a storm is active. Between storms, it does not heal. Charged shards reduce its healing; a pylon weakens its lightning attacks.
log-devourer=Long Echo, log 15. The Devourer regenerates quickly. In a regular fight it dives at 50 % health; in a lair it dives at 66 % and 33 %. It resurfaces eight seconds later beyond the beacon.
log-last-commander=Long Echo, log 17. The Last Commander drops six soldiers every 45 seconds. Below 66 % health, it marks a building for four seconds before firing four rockets every 12 seconds. Below 33 %, soldiers land beyond the beacon. When this mod's setting is on, its atomic rocket targets the nearest turret within 60 tiles every 90 seconds, or the beacon if no turret is in range. This is the last entry.
