beacon-rules=[font=default-semibold]How it goes:[/font] place it on Nexus. The countdown runs while someone of your force is on the planet, and two precursor waves come for the beacon. If it is destroyed, the beacon is lost; pick it up to call the summon off. One summon at a time.

