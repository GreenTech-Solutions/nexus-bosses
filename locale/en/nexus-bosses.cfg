codex-alive=Not defeated yet.
answer-arachnid-queen=The nests die with the Queen, and area damage can hit them.
answer-watcher=Without living drones it cannot mark a building; new drones arrive every 60 seconds.
answer-rogue-spidertron=Its EMP disables buildings within 12 tiles of the pole with the most buildings; turrets outside the circle keep firing.
answer-twin-maws=Kill both within 20 seconds; the stationary maws outrange turrets.
answer-colossus=The next variant appears in the Codex beforehand, and each variant has its own weakness.
answer-plague-hulk=Spores follow the sortie squad; kill the squad before it reaches turrets.
answer-storm-guardian=Charged shards in the beacon reduce its healing during a storm.
answer-devourer=It resurfaces on the far side of the beacon, so defend from every direction.
answer-last-commander=The four-rocket strike follows a four-second line-and-circle mark; below 33 % health, drops land beyond the beacon. Turn off this mod's atomic rocket setting or repair the lair pylon to prevent its 90-second rocket.
