[technology-description]
nexus-whisper=Unlocks the Arachnid Queen, Watcher and Rogue Spidertron beacons. Researched when you build a shield stabilizer on Nexus.
nexus-whisper-scripted=Unlocks the Arachnid Queen, Watcher and Rogue Spidertron beacons. Researched when Nexus is discovered.
nexus-chorus=Unlocks the Twin Maws, Colossus and Plague Hulk beacons after the three Whisper bosses are defeated. Laser and electric damage +20 %.
nexus-convergence=Unlocks the Storm Guardian, Devourer and Last Commander beacons after the three Chorus bosses are defeated. When the trials gate the warp drive, it also unlocks the warp key recipe. Bullet, railgun, rocket and cannon damage +20 %.
nexus-silence=Opens the routes of the warp drive. Researched by placing the warp key in the vault reliquary.
nexus-signal-bearing=Unlocks the direction finder. Researched when you find the first log of the expedition.
nexus-builders-echo=Research productivity +10 %. Researched by taking the relic from the builders' vault.

