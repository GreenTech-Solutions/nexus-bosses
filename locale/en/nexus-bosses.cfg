[entity-description]
nexus-arachnid-queen=A giant arachnid that lays nests.
nexus-queen-nest=A nest of the Arachnid Queen. It dies with her.
nexus-maw-fire=One of the Twin Maws.
nexus-maw-acid=One of the Twin Maws.
nexus-plague-hulk=A spawner guarded by infected turrets. It sends sorties whose spores disable nearby turrets.
nexus-storm-guardian=An enemy that calls lightning during storms and heals while a storm is active.
nexus-devourer=A segmented demolisher that dives at health thresholds and resurfaces beyond the beacon.
nexus-watcher=An electric saucer whose living escort drones enable marked four-rocket strikes on player buildings.
nexus-colossus-fire=Fires a fire cluster at a marked point every 4 seconds.
nexus-colossus-storm=Creates an electric shock around itself every 3 seconds.
nexus-colossus-armored=Absorbs damage for 10 seconds every 40 seconds; damage of its weak types breaks the shell early.
nexus-colossus-mother=Summons up to six behemoth biters every 20 seconds.
nexus-colossus-fire-spitter=Fires five fire projectiles at a nearby turret every 15 seconds.
nexus-colossus-acid-spitter=Fires five acid streams at a nearby turret every 15 seconds.
nexus-rogue-spidertron=A spidertron that hunts power poles and disables nearby buildings with an EMP.
nexus-expedition-wreck=Open the wreck to add its Long Echo log to the Codex.
nexus-bosses-direction-finder=A radar tuned to the signal. Set it to a boss: every sector it scans draws a bearing toward the lair of that boss, narrower each time. Two precise bearings that cross find the lair.
nexus-bosses-pylon=An uncommon or better trophy of this lair's boss repairs the pylon and weakens that boss's main mechanic by 25–100 %, according to trophy quality. With the pylon in a lair fight, the second trophy matches its quality and the loot is half a beacon recipe.
nexus-expedition-camp=The ship of the Long Echo, where the expedition set up camp. Its first log is inside.
nexus-expedition-last-stand=The escape pod of the Long Echo commander.
nexus-bosses-obelisk=The obelisks around the vault light up one after another, always in the same order.
nexus-bosses-glyph-console=Set the four glyphs of the obelisks as signals. The value of each is its place in the order the obelisks light up, 1 to 4. No other signals.
nexus-bosses-vault-hatch=Open it to go down into the vault of the builders.
nexus-bosses-vault-stairs=Open it to go back up to Nexus.
nexus-bosses-reliquary=Place a warp key here to research Silence. When the trials gate the warp drive, the first key also raises the builders' relic.
nexus-bosses-builders-relic=Mine it to take it.

