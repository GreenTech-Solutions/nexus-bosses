[entity-description]
nexus-arachnid-queen=The mother of the arachnid hives of Nexus. Lays nests when she is hurt.
nexus-queen-nest=Breeds warriors and spitters for the Arachnid Queen and sends them at your base. Dies with her.
nexus-maw-fire=One of the Twin Maws. Spits fire 80 tiles far.
nexus-maw-acid=One of the Twin Maws. Spits acid 60 tiles far.
nexus-plague-hulk=A crashed ship full of toxic boss biters. Its spores shut down your turrets for a while.
nexus-storm-guardian=A walking electric giant. Storms heal it, lightning does not hurt it.
nexus-devourer=A demolisher of five million health. Dives at half of it and comes back up elsewhere.

[technology-name]
nexus-whisper=Whisper
nexus-chorus=Chorus
nexus-convergence=Convergence
nexus-silence=Silence

[technology-description]
nexus-whisper=Nexus starts to whisper. Opens the summon beacons of the Arachnid Queen, the Watcher and the Rogue Spidertron. Researched when you build a shield stabilizer on Nexus.
nexus-whisper-scripted=Nexus starts to whisper. Opens the summon beacons of the Arachnid Queen, the Watcher and the Rogue Spidertron. Researched when Nexus is discovered.
nexus-chorus=The whisper turns into a chorus. Opens the beacons of the Twin Maws, the Colossus and the Plague Hulk. Researched when the three bosses of the Whisper are dead. Laser and electric damage +20 %: the Chorus is weak to them.
nexus-convergence=What is left of the signal converges. Opens the beacons of the Storm Guardian, the Devourer and the Last Commander, and the recipe of the warp key. Researched when the three bosses of the Chorus are dead. Bullet, railgun, rocket and cannon damage +20 %: the Convergence shrugs off energy weapons.
nexus-silence=The signal of Nexus is gone. Opens the routes of the warp drive. Researched by crafting the warp key from the nine trophies.

