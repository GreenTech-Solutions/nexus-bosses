[item-description]
nexus-summon-arachnid-queen=Circle I. The Arachnid Queen and four leviathans come on foot from 150-250 tiles away and march on the beacon. Victory: the queen is dead.
nexus-summon-flying-saucer=Circle I. A flying saucer of Big Monsters comes from several hundred tiles away. Victory: every new saucer is destroyed.
nexus-summon-evil-spider=Circle I. An evil spidertron of Big Monsters comes from several hundred tiles away. Victory: every new spidertron is destroyed.
nexus-summon-great-worms=Circle II. Boss worms of Big Monsters burrow up inside your base. Victory: every new boss worm is dead.
nexus-summon-biterzilla=Circle II. A giant biter or spitter, a mother or a human boss of Big Monsters comes from several hundred tiles away. Victory: every new boss is dead.
nexus-summon-toxic-lair=Circle II. A crashed toxic ship lands 150-250 tiles away, sends out boss biters and spitters and is guarded by laser, gun and artillery turrets. Victory: the ship is destroyed.
nexus-summon-storm-guardian=Circle III. A walking electric giant with 20 walkers and 20 flyers comes from 150-250 tiles away. Victory: the guardian is dead, and the storms of Nexus stay weaker for good.
nexus-summon-host-worm=Circle III. A giant demolisher crawls in from 150-250 tiles away and claims the land around the beacon. Victory: the worm is dead.
nexus-summon-final-boss=Circle III. The ultimate boss of Big Monsters comes from several hundred tiles away. Victory: every new ultimate boss is dead.

