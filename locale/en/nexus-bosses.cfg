lore-arachnid-queen=The mother of the arachnid hives of Nexus, with two leviathans at her side. Hurt her and she lays nests.
lore-watcher=A flying saucer of Big Monsters that has watched Nexus longer than anyone has lived on it.
lore-rogue-spidertron=A spidertron of Big Monsters that lost its owner long ago and kept its rocket launchers.
lore-twin-maws=Two boss worms of Big Monsters, one spits fire and one spits acid. They break out of the ground near the beacon and stay there.
lore-colossus=A giant of Big Monsters: a biterzilla, a giant spitter, a brood mother or a human champion. You learn which when it shows up.
lore-plague-hulk=A crashed ship full of toxic boss biters. It cannot move, so its ten infected turrets and its spores do the work.
lore-storm-guardian=A walking electric giant with twenty walkers and twenty flyers. It feeds on the storms of Nexus; once it is dead, the storms lose half of their lightning for good.
lore-devourer=A demolisher grown to five million health. It claims the land around the beacon and dives when it is hurt.
lore-last-commander=The ultimate boss of Big Monsters: a commander with a cannon and a stream of soldiers.

tactic-arachnid-queen=[font=default-semibold]How to fight:[/font] laser and fire hurt her more than usual, acid and poison not at all. Break the nests before their brood reaches the base.
tactic-watcher=[font=default-semibold]How to fight:[/font] it shrugs off most damage; laser and electricity get through. It fights from afar, so bring range.
tactic-rogue-spidertron=[font=default-semibold]How to fight:[/font] heavy armor against everything. Pile on damage and keep repair packs near the turrets.
tactic-twin-maws=[font=default-semibold]How to fight:[/font] they outrange turrets (fire 80 tiles, acid 60), so take the fight to them. The fire maw is weak to laser and electricity, the acid maw to fire.
tactic-colossus=[font=default-semibold]How to fight:[/font] the weakness depends on what comes. Some giants fold to physical damage, others to laser: bring both.
tactic-plague-hulk=[font=default-semibold]How to fight:[/font] thin armor, but its artillery shells your base until it falls. Go out and kill it. Every sortie stalls three of your turrets for 15 seconds.
tactic-storm-guardian=[font=default-semibold]How to fight:[/font] laser and fire barely scratch it, lightning heals it. Use bullets, rails and rockets, and strike between the storms.
tactic-devourer=[font=default-semibold]How to fight:[/font] laser, fire and impact do nothing, and it heals about 3 000 health a second. Explosions and physical damage. When it dives, it comes up on the other side of the beacon.
tactic-last-commander=[font=default-semibold]How to fight:[/font] about a third of every damage type is lost on it. It is fast and its cannon reaches far. Thin out its soldiers early: they keep coming.

