command-abort-help=Stops the trial under way without a victory; its bosses stay alive. Administrators only.
log-arachnid-queen=Long Echo, log 3. The mounds are hives, and the hives have a mother. She came for our transmitter with two leviathans. Lasers and flamers cut her better than rounds; acid and gas did nothing at all. Every time we hurt her she stopped to lay nests, and the nests kept sending warriors at us until we burned them.
log-watcher=Long Echo, log 5. Something in orbit watches the camp. When it came down it kept its distance and burned our turrets one by one. Most of what we fired slid off its hull; lasers and electric arcs got through. Shoot it from as far as you can.
log-rogue-spidertron=Long Echo, log 6. A spidertron with no owner and full rocket pods. Its armour took everything about equally, so we poured damage into it and kept repair packs near the turrets. We lost the north wall anyway.
log-twin-maws=Long Echo, log 9. Two worms surfaced near the transmitter, one spitting fire, one acid. They never moved and did not need to: they outreach every turret we had, so we walked out to them. The fire one hated lasers and arcs; the acid one burned.
log-colossus=Long Echo, log 11. Everyone who saw the giant described a different one: a biter the size of a hill, a spitter, a mother with brood, once a man in armour. Its weakness changed with it: some went down to bullets, others only to lasers. Bring both.
log-plague-hulk=Long Echo, log 12. A ship fell out of the storm full of toxic biters, and its turrets woke up the moment it landed. The hull is thin, but its artillery reached the camp, and every sortie came with a cloud of spores that silenced our turrets for a while. You cannot wait it out. Go and kill it.
log-storm-guardian=Long Echo, log 14. The walker came out of the storm with an army of walkers and flyers. Lasers and fire barely marked it, and lightning healed it. Between the storms it is only a very big target for bullets, rails and rockets: strike then. When it fell, the storms lost half of their lightning.
log-devourer=Long Echo, log 15. The ground under the camp moved. The worm is the size of a ridge and heals faster than anything but explosives and rails could hurt it; lasers, fire and impact did nothing. Half dead, it dove and came up on the other side of the transmitter.
log-last-commander=Long Echo, log 17. Military chatter on a frequency nobody has used for a century. The commander came with soldiers, and more kept coming. A third of every hit is lost on it, and its cannon outreaches ours. Thin out the soldiers early. This is the last entry.
